<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЧасовойМастер — Запись</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>

<body>

    <header>
        <div class="logo"><span>Часовой</span>Мастер</div>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="booking.html">Запись</a></li>
                <li><a href="orders.html">Мои записи</a></li>
                <li><a href="profile.html">Профиль</a></li>
                <li><a href="contacts.html">Контакты</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">

            <h2 class="section-title">Онлайн-запись</h2>

            <div class="form-block">
                <h2>Заполните форму записи</h2>

                <form id="bookingForm">

                    <div class="form-group">
                        <label for="name">Ваше имя *</label>
                        <input type="text" id="name" placeholder="Иван Иванов">
                    </div>

                    <div class="form-group">
                        <label for="phone">Телефон *</label>
                        <input type="tel" id="phone" placeholder="+7 (999) 000-00-00">
                    </div>

                    <div class="form-group">
                        <label for="model">Модель часов</label>
                        <input type="text" id="model" placeholder="Например: Casio F-91W">
                    </div>

                    <div class="form-group">
                        <label for="service">Услуга *</label>
                        <select id="service">
                            <option value="">-- Выберите услугу --</option>
                            <option value="Замена батарейки">Замена батарейки</option>
                            <option value="Ремонт механизма">Ремонт механизма</option>
                            <option value="Замена стекла">Замена стекла</option>
                            <option value="Диагностика">Диагностика</option>
                            <option value="Чистка и смазка">Чистка и смазка</option>
                            <option value="Замена ремешка">Замена ремешка</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Дата посещения *</label>
                        <input type="date" id="date">
                    </div>

                    <div class="form-group">
                        <label for="comment">Описание неисправности</label>
                        <textarea id="comment" placeholder="Опишите проблему с часами..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-full">Подтвердить запись</button>

                </form>
            </div>

            <br>
            <p class="form-hint">
                После подтверждения мы свяжемся с вами по телефону для уточнения деталей.
            </p>

        </div>
    </main>
    <footer>
        <p>© 2026 ЧасовойМастер. Все права защищены.</p>
    </footer>

    <script src="src/js/main.js" defer></script>
</body>

</html>
